# ============================================================
# Hunu Wallpaper Splitter
# Example monitor configuration
# ============================================================
#
# Hunu Wallpaper supports 1 to 3 monitors.
#
# OUTPUT
#   The Hyprland output assigned to this monitor.
#   Examples: HDMI-A-1, DP-1, DP-2
#
# WIDTH / HEIGHT
#   Final wallpaper resolution in pixels.
#   These describe the monitor as you actually view it.
#   A portrait 1920x1080 monitor would therefore normally be
#   configured as 1080x1920.
#
# PHYSICAL_WIDTH_CM / PHYSICAL_HEIGHT_CM
#   Measure the complete monitor rectangle, INCLUDING bezels.
#   These measurements are used by Linked mode to preserve
#   physical image scale across monitors.
#
# X_CM / Y_CM
#   Position of the monitor in the real-world layout.
#   These values do not need to start at zero. Hunu Wallpaper
#   normalizes the complete layout internally.
#
# Example:
#
#   X_CM=0,  Y_CM=0     -> reference monitor
#   X_CM=34, Y_CM=6     -> 34 cm to the right and 6 cm lower
#
# ENABLED
#   true  = use this monitor
#   false = ignore this monitor
#
# Monitor 1 must always be enabled.
# Monitor 2 and Monitor 3 are optional.
# ============================================================


# ------------------------------------------------------------
# General
# ------------------------------------------------------------

OUTPUT_DIR="$HOME/Pictures/Wallpapers"


# ------------------------------------------------------------
# Monitor 1
# ------------------------------------------------------------

MONITOR_1_ENABLED=true
MONITOR_1_OUTPUT="DP-2"

MONITOR_1_WIDTH=1080
MONITOR_1_HEIGHT=1920

MONITOR_1_PHYSICAL_WIDTH_CM=34
MONITOR_1_PHYSICAL_HEIGHT_CM=62

MONITOR_1_X_CM=0
MONITOR_1_Y_CM=0


# ------------------------------------------------------------
# Monitor 2
# ------------------------------------------------------------

MONITOR_2_ENABLED=true
MONITOR_2_OUTPUT="HDMI-A-1"

MONITOR_2_WIDTH=3840
MONITOR_2_HEIGHT=2160

MONITOR_2_PHYSICAL_WIDTH_CM=72
MONITOR_2_PHYSICAL_HEIGHT_CM=41

MONITOR_2_X_CM=34
MONITOR_2_Y_CM=6


# ------------------------------------------------------------
# Monitor 3
# ------------------------------------------------------------

MONITOR_3_ENABLED=false
MONITOR_3_OUTPUT=""

MONITOR_3_WIDTH=1920
MONITOR_3_HEIGHT=1080

MONITOR_3_PHYSICAL_WIDTH_CM=60
MONITOR_3_PHYSICAL_HEIGHT_CM=34

MONITOR_3_X_CM=106
MONITOR_3_Y_CM=0
